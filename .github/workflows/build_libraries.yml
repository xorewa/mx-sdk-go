name: Build libraries

on:
  push:
    branches: [NewArc]
  pull_request:
    branches: [NewArc]

permissions:
  contents: read

env:
  # Xorewa modules are private forks and cannot be verified by sum.golang.org.
  # Public dependencies remain protected by the normal checksum database.
  GONOSUMDB: github.com/xorewa/*

jobs:      
  build:
    strategy:
      matrix:
        runs-on: [ubuntu-22.04, macos-14, windows-2019]
    runs-on: ${{ matrix.runs-on }}
    name: Build
    steps:

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.23.6
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
      with:
        fetch-depth: "0"

    - name: Get dependencies
      shell: bash
      run: go mod download

    - name: Build libbls (Linux)
      if: runner.os == 'Linux'
      run: | 
        cd ./libraries/libbls
        go build -buildmode=c-shared -o $GITHUB_WORKSPACE/libbls.so .

    - name: Build libbls (MacOS)
      if: runner.os == 'macOS'
      run: | 
        cd ./libraries/libbls
        go build -buildmode=c-shared -o $GITHUB_WORKSPACE/libbls.dylib .

    - name: Build libbls (Windows)
      shell: bash
      if: runner.os == 'Windows'
      run: | 
        cd ./libraries/libbls
        go build -buildmode=c-shared -o $GITHUB_WORKSPACE/libbls.dll .

    - name: Save artifacts
      uses: actions/upload-artifact@v4
      with:
        name: artifacts
        path: |
          libbls.so
          libbls.dylib
          libbls.dll
        if-no-files-found: error
