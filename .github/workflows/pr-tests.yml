name: Tests

on:
  push:
    branches: [NewArc]
  pull_request:
    branches: [NewArc]

permissions:
  contents: read

env:
  # Xorewa modules are private forks and cannot be verified by sum.golang.org.
  # Public dependencies remain protected by the normal checksum database.
  GONOSUMDB: github.com/xorewa/*

jobs:
  test:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go 1.17.6
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.6
        id: go

      - name: Check out code
        uses: actions/checkout@v4

      - name: Get dependencies
        run: go mod download
      - name: Unit tests
        run: make test
